<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Ballers League Admin Panel — Manage fixtures and results">
  <title>Ballers League — Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #050505;
      --bg-secondary: #0a0a0a;
      --bg-card: #0f0f0f;
      --bg-card-hover: #141414;
      --bg-elevated: #1a1a1a;
      --bg-input: #111111;
      --border-subtle: rgba(255,255,255,0.06);
      --border-medium: rgba(255,255,255,0.1);
      --border-accent: rgba(255,255,255,0.15);
      --border-focus: rgba(200,168,78,0.5);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.65);
      --text-muted: rgba(255,255,255,0.35);
      --accent-gold: #c8a84e;
      --accent-gold-dim: rgba(200,168,78,0.15);
      --dot-win: #00d26a;
      --dot-loss: #e63946;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --ease-out: cubic-bezier(0.16,1,0.3,1);
    }

    html { font-size: 14px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Login Screen ──────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card .logo-icon {
      width: 56px; height: 56px; margin: 0 auto 16px;
    }

    .login-card h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .login-card .subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 28px;
    }

    .login-card input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.9rem;
      text-align: center;
      letter-spacing: 0.15em;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .login-card input:focus {
      border-color: var(--border-focus);
    }

    .login-card input::placeholder {
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .login-card button:hover {
      background: #d4b65c;
      transform: translateY(-1px);
    }

    .login-card button:active { transform: translateY(0); }

    .login-error {
      color: var(--dot-loss);
      font-size: 0.75rem;
      margin-top: 12px;
      min-height: 20px;
    }

    /* ── Admin Panel ──────────────────────────────────── */
    #admin-panel { display: none; }

    .admin-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
    }

    .admin-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-header h1 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .admin-season-selector select {
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      color: var(--accent-gold);
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .admin-season-selector select:hover {
      border-color: var(--accent-gold);
    }

    .admin-season-selector select:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 2px var(--accent-gold-dim);
    }

    .admin-new-season-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, rgba(200, 168, 78, 0.1) 0%, rgba(200, 168, 78, 0.05) 100%);
      border: 1px solid rgba(200, 168, 78, 0.25);
      border-radius: 12px;
      animation: adminSlideIn 0.3s ease;
    }

    .admin-new-season-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-new-season-icon {
      font-size: 1.5rem;
    }

    .admin-new-season-info strong {
      display: block;
      color: var(--accent-gold);
      font-family: var(--font-display);
      font-size: 0.85rem;
    }

    .admin-new-season-info p {
      color: var(--text-secondary);
      font-size: 0.72rem;
      margin-top: 2px;
    }

    .btn-new-season {
      background: linear-gradient(135deg, var(--accent-gold) 0%, #b8943c 100%);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-new-season:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(200, 168, 78, 0.3);
    }

    .btn-new-season:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      border-color: var(--dot-loss);
      color: var(--dot-loss);
    }

    .btn-back {
      background: none;
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-back:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .admin-header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── Matchday Navigation ──────────────────────────── */
    .admin-matchday-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      gap: 12px;
    }

    .admin-md-arrow {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s var(--ease-out);
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .admin-md-arrow:hover {
      background: var(--bg-elevated);
      border-color: var(--border-accent);
    }

    .admin-md-arrow:disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    .admin-md-info {
      text-align: center;
      flex: 1;
    }

    .admin-md-info .md-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .admin-md-info .md-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Actions Bar ───────────────────────────────────── */
    .admin-actions-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      padding: 0 20px;
    }

    .btn-reset-all {
      background: none;
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
      padding: 10px 20px;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-reset-all:hover {
      border-color: var(--dot-loss);
      color: var(--dot-loss);
      background: rgba(230, 57, 70, 0.05);
    }

    .btn-reset-all svg {
      transition: transform 0.3s var(--ease-out);
    }

    .btn-reset-all:hover svg {
      transform: rotate(-180deg);
    }

    /* ── Match Cards ──────────────────────────────────── */
    .admin-matches {
      padding: 0 20px 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.25s ease;
      animation: cardFade 0.3s ease;
    }

    @keyframes cardFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .match-card.completed {
      border-color: rgba(0, 210, 106, 0.15);
    }

    .match-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .match-team-info {
      flex: 1;
      text-align: center;
    }

    .match-team-name {
      font-weight: 700;
      font-size: 0.85rem;
      line-height: 1.2;
    }

    .match-team-club {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .match-vs {
      padding: 0 16px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Score Inputs */
    .match-score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .score-input {
      width: 56px;
      height: 48px;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: border-color 0.3s ease;
      -moz-appearance: textfield;
    }

    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .score-input:focus {
      border-color: var(--border-focus);
    }

    .score-dash {
      font-size: 1.2rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* Action Buttons */
    .match-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-save {
      flex: 1;
      padding: 12px;
      background: var(--dot-win);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-save:hover { background: #00e676; transform: translateY(-1px); }
    .btn-save:active { transform: translateY(0); }
    .btn-save:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .btn-reset {
      padding: 12px 16px;
      background: none;
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      border-color: var(--dot-loss);
      color: var(--dot-loss);
    }

    /* Status indicator */
    .match-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .status-upcoming .status-dot { background: var(--text-muted); }
    .status-upcoming { color: var(--text-muted); }

    .status-completed .status-dot { background: var(--dot-win); }
    .status-completed { color: var(--dot-win); }

    .status-live .status-dot { 
      background: var(--dot-loss); 
      animation: livePulse 1.8s infinite ease-in-out;
    }
    .status-live { color: var(--dot-loss); }
    
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }

    /* Status & Stream Inputs inside Admin Match Cards */
    .match-status-select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      gap: 12px;
    }

    .match-status-select-row label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .status-select {
      flex: 1;
      height: 34px;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 0 8px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.3s ease;
      cursor: pointer;
    }

    .status-select:focus {
      border-color: var(--border-focus);
    }

    .match-stream-url-row {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stream-url-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stream-url-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 38px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stream-url-input {
      flex: 1;
      height: 34px;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 0 10px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .stream-url-input:focus {
      border-color: var(--border-focus);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-elevated);
      border: 1px solid var(--border-medium);
      color: var(--text-primary);
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      z-index: 1000;
      transition: transform 0.4s var(--ease-out), opacity 0.4s ease;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success { border-color: rgba(0,210,106,0.3); }
    .toast.error { border-color: rgba(230,57,70,0.3); }

    /* ── Responsive ──────────────────────────────────── */
    @media (min-width: 600px) {
      html { font-size: 15px; }
      .admin-matches { padding: 0 24px 100px; }
      .admin-matchday-nav { padding: 20px 24px; }
      .login-card { padding: 48px 40px; }
    }

    @media (min-width: 960px) {
      .admin-matches {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════ LOGIN SCREEN ═══════════════════ -->
  <div id="login-screen">
    <div class="login-card">
      <div class="logo-icon">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="28" r="27" stroke="white" stroke-width="1.5"/>
          <path d="M28 8 L34 20 L48 23 L38 33 L41 48 L28 41 L15 48 L18 33 L8 23 L22 20 Z" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <h1>Admin Panel</h1>
      <p class="subtitle">Ballers League — Season 1</p>
      <input type="password" id="login-key" placeholder="Enter admin key" autocomplete="off" />
      <button id="btn-login" onclick="handleLogin()">Sign In</button>
      <p class="login-error" id="login-error"></p>
    </div>
  </div>

  <!-- ═══════════════════ ADMIN PANEL ═══════════════════ -->
  <div id="admin-panel">
    <header class="admin-header">
      <div class="admin-header-left">
        <h1>Admin Panel</h1>
        <div class="admin-season-selector">
          <select id="admin-season-select" onchange="adminChangeSeason(this.value)">
          </select>
        </div>
      </div>
      <div class="admin-header-actions">
        <a href="/" class="btn-back">
          <span>← Site</span>
        </a>
        <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
      </div>
    </header>

    <div id="admin-new-season-banner" class="admin-new-season-banner" style="display:none;">
      <div class="admin-new-season-info">
        <span class="admin-new-season-icon">🏆</span>
        <div>
          <strong>Season Complete!</strong>
          <p>All matches have been played. Ready to start the next season?</p>
        </div>
      </div>
      <button class="btn-new-season" id="btn-new-season" onclick="createNewSeason()">
        Continue to Next Season →
      </button>
    </div>

    <div class="admin-matchday-nav">
      <button class="admin-md-arrow" id="admin-prev" onclick="adminChangeMatchday(-1)">‹</button>
      <div class="admin-md-info">
        <div class="md-title" id="admin-md-title">Matchday 1</div>
        <div class="md-sub" id="admin-md-sub">1 / 22</div>
      </div>
      <button class="admin-md-arrow" id="admin-next" onclick="adminChangeMatchday(1)">›</button>
    </div>

    <div class="admin-actions-bar">
      <button class="btn-reset-all" onclick="resetMatchday()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <polyline points="3 3 3 8 8 8"/>
        </svg>
        <span>Reset Matchday Results</span>
      </button>
    </div>

    <div class="admin-matches" id="admin-matches">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ── State ──────────────────────────────────────────
    let adminKey = '';
    let leagueData = null;
    let adminMatchday = 0;
    let adminSeasonId = null;

    // ── Login ─────────────────────────────────────────
    document.getElementById('login-key').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const key = document.getElementById('login-key').value.trim();
      if (!key) return;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
        });

        const data = await res.json();

        if (data.success) {
          adminKey = key;
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('admin-panel').style.display = 'block';
          await loadLeagueData();
        } else {
          document.getElementById('login-error').textContent = 'Invalid admin key';
          document.getElementById('login-key').value = '';
          document.getElementById('login-key').focus();
        }
      } catch (err) {
        document.getElementById('login-error').textContent = 'Server connection failed';
      }
    }

    function handleLogout() {
      adminKey = '';
      leagueData = null;
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('login-key').value = '';
      document.getElementById('login-error').textContent = '';
    }

    // ── Load Data ─────────────────────────────────────
    async function loadLeagueData(seasonId) {
      try {
        const url = seasonId ? `/api/data?season=${seasonId}` : '/api/data';
        const res = await fetch(url);
        leagueData = await res.json();
        adminSeasonId = leagueData.seasonId || null;
        renderAdminSeasonSelector();
        renderAdminMatchday();
        checkSeasonComplete();
      } catch (err) {
        showToast('Failed to load data', 'error');
      }
    }

    function renderAdminSeasonSelector() {
      const select = document.getElementById('admin-season-select');
      if (!select || !leagueData.seasons) return;
      select.innerHTML = '';
      leagueData.seasons.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name + (s.status === 'active' ? ' (Active)' : '');
        if (s.id === adminSeasonId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function adminChangeSeason(seasonId) {
      adminMatchday = 0;
      loadLeagueData(parseInt(seasonId, 10));
    }

    function checkSeasonComplete() {
      const banner = document.getElementById('admin-new-season-banner');
      if (!banner || !leagueData.fixtures) return;
      const activeSeason = leagueData.seasons && leagueData.seasons.find(s => s.status === 'active');
      if (!activeSeason || activeSeason.id !== adminSeasonId) {
        banner.style.display = 'none';
        return;
      }
      const allCompleted = leagueData.fixtures.every(md =>
        md.matches.every(m => m.status === 'completed')
      );
      banner.style.display = allCompleted ? 'flex' : 'none';
    }

    async function createNewSeason() {
      if (!confirm('Start a new season? This will generate a fresh set of fixtures. The current season will be archived.')) {
        return;
      }
      const btn = document.getElementById('btn-new-season');
      btn.disabled = true;
      btn.textContent = 'Creating...';
      try {
        const res = await fetch('/api/admin/season', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': adminKey,
          },
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message, 'success');
          adminMatchday = 0;
          await loadLeagueData(data.season.id);
        } else {
          showToast(data.error || 'Failed to create season', 'error');
        }
      } catch (err) {
        showToast('Server error creating season', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Continue to Next Season →';
      }
    }

    // ── Matchday Navigation ───────────────────────────
    function adminChangeMatchday(delta) {
      const newIdx = adminMatchday + delta;
      if (newIdx < 0 || newIdx >= leagueData.fixtures.length) return;
      adminMatchday = newIdx;
      renderAdminMatchday();
    }

    // ── Render ─────────────────────────────────────────
    function renderAdminMatchday() {
      const fixtures = leagueData.fixtures;
      const md = fixtures[adminMatchday];

      document.getElementById('admin-md-title').textContent = `Matchday ${md.matchday}`;
      document.getElementById('admin-md-sub').textContent = `${adminMatchday + 1} / ${fixtures.length}`;
      document.getElementById('admin-prev').disabled = adminMatchday === 0;
      document.getElementById('admin-next').disabled = adminMatchday === fixtures.length - 1;

      const container = document.getElementById('admin-matches');
      container.innerHTML = '';

      md.matches.forEach((match, idx) => {
        const card = document.createElement('div');
        card.className = `match-card ${match.status === 'completed' ? 'completed' : ''}`;
        card.style.animationDelay = `${idx * 0.05}s`;

        const homeVal = match.homeScore !== null ? match.homeScore : '';
        const awayVal = match.awayScore !== null ? match.awayScore : '';
        
        let statusClass = 'status-upcoming';
        let statusLabel = 'Upcoming';
        if (match.status === 'completed') {
          statusClass = 'status-completed';
          statusLabel = 'Completed';
        } else if (match.status === 'live') {
          statusClass = 'status-live';
          statusLabel = 'Live';
        }

        card.innerHTML = `
          <div class="match-teams">
            <div class="match-team-info">
              <div class="match-team-name">${match.home.player}</div>
              <div class="match-team-club">${match.home.club}</div>
            </div>
            <div class="match-vs">VS</div>
            <div class="match-team-info">
              <div class="match-team-name">${match.away.player}</div>
              <div class="match-team-club">${match.away.club}</div>
            </div>
          </div>
          <div class="match-score-row">
            <input type="number" class="score-input" id="home-${match.home.id}-${match.away.id}"
              value="${homeVal}" min="0" max="99" placeholder="0">
            <span class="score-dash">—</span>
            <input type="number" class="score-input" id="away-${match.home.id}-${match.away.id}"
              value="${awayVal}" min="0" max="99" placeholder="0">
          </div>
          
          <div class="match-status-select-row">
            <label for="status-${match.home.id}-${match.away.id}">Status:</label>
            <select class="status-select" id="status-${match.home.id}-${match.away.id}">
              <option value="upcoming" ${match.status === 'upcoming' ? 'selected' : ''}>Upcoming</option>
              <option value="live" ${match.status === 'live' ? 'selected' : ''}>Live</option>
              <option value="completed" ${match.status === 'completed' ? 'selected' : ''}>Completed</option>
            </select>
          </div>

          <div class="match-stream-url-row">
            <div class="stream-url-input-group">
              <span class="stream-url-label">Home</span>
              <input type="url" class="stream-url-input" id="home-stream-${match.home.id}-${match.away.id}"
                placeholder="Twitch or Kick URL" value="${match.homeStreamUrl || ''}">
            </div>
            <div class="stream-url-input-group">
              <span class="stream-url-label">Away</span>
              <input type="url" class="stream-url-input" id="away-stream-${match.home.id}-${match.away.id}"
                placeholder="Twitch or Kick URL" value="${match.awayStreamUrl || ''}">
            </div>
          </div>

          <div class="match-actions">
            <button class="btn-save" onclick="saveMatch(${md.matchday}, ${match.home.id}, ${match.away.id})">
              Save Match
            </button>
            <button class="btn-reset" onclick="resetMatch(${md.matchday}, ${match.home.id}, ${match.away.id})">
              Reset
            </button>
          </div>
          <div class="match-status ${statusClass}">
            <span class="status-dot"></span>
            <span>${statusLabel}</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // ── Save Match ─────────────────────────────────────
    async function saveMatch(matchday, homeId, awayId) {
      const homeScore = document.getElementById(`home-${homeId}-${awayId}`).value;
      const awayScore = document.getElementById(`away-${homeId}-${awayId}`).value;
      const status = document.getElementById(`status-${homeId}-${awayId}`).value;
      const homeStreamUrl = document.getElementById(`home-stream-${homeId}-${awayId}`).value.trim();
      const awayStreamUrl = document.getElementById(`away-stream-${homeId}-${awayId}`).value.trim();

      if (status === 'completed' && (homeScore === '' || awayScore === '')) {
        showToast('Enter both scores to mark match as completed', 'error');
        return;
      }

      try {
        const res = await fetch('/api/admin/match', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': adminKey,
          },
          body: JSON.stringify({
            matchday,
            homeId,
            awayId,
            homeScore: homeScore !== '' ? parseInt(homeScore) : null,
            awayScore: awayScore !== '' ? parseInt(awayScore) : null,
            status,
            homeStreamUrl: homeStreamUrl || null,
            awayStreamUrl: awayStreamUrl || null,
            seasonId: adminSeasonId
          }),
        });

        const data = await res.json();

        if (data.success) {
          showToast(data.message, 'success');
          await loadLeagueData(); // Refresh
        } else {
          showToast(data.error || 'Failed to save', 'error');
        }
      } catch (err) {
        showToast('Server error', 'error');
      }
    }

    // ── Reset Match ────────────────────────────────────
    async function resetMatch(matchday, homeId, awayId) {
      try {
        const res = await fetch('/api/admin/match', {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': adminKey,
          },
          body: JSON.stringify({ matchday, homeId, awayId, seasonId: adminSeasonId }),
        });

        const data = await res.json();

        if (data.success) {
          showToast('Match reset', 'success');
          await loadLeagueData();
        } else {
          showToast(data.error || 'Failed to reset', 'error');
        }
      } catch (err) {
        showToast('Server error', 'error');
      }
    }

    // ── Reset Entire Matchday ──────────────────────────
    async function resetMatchday() {
      const fixtures = leagueData.fixtures;
      const md = fixtures[adminMatchday];
      if (!md) return;

      if (!confirm(`Are you sure you want to reset all match results for Matchday ${md.matchday}? This will clear all scorelines for this matchday.`)) {
        return;
      }

      try {
        const res = await fetch('/api/admin/match', {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': adminKey,
          },
          body: JSON.stringify({ matchday: md.matchday, seasonId: adminSeasonId }),
        });

        const data = await res.json();

        if (data.success) {
          showToast(`Matchday ${md.matchday} reset`, 'success');
          await loadLeagueData();
        } else {
          showToast(data.error || 'Failed to reset matchday', 'error');
        }
      } catch (err) {
        showToast('Server error', 'error');
      }
    }

    // ── Toast ──────────────────────────────────────────
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
